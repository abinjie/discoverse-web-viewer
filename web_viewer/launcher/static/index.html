<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISCOVERSE Web Viewer Launcher</title>
  <link rel="stylesheet" href="/static/launcher.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>DISCOVERSE Web Viewer Launcher</h1>
      <p class="subtitle">选择机械臂、任务与渲染模式，一键启动浏览器 Viewer</p>
    </header>

    <main class="layout">
      <section class="panel config-panel">
        <h2>会话配置</h2>

        <div class="field">
          <label>机械臂</label>
          <div id="robot_group" class="radio-group"></div>
        </div>

        <div class="field">
          <label for="task_select">任务场景</label>
          <select id="task_select"></select>
          <p id="task_runtime" class="hint"></p>
        </div>

        <div class="field">
          <label>渲染模式</label>
          <div class="radio-group">
            <label><input type="radio" name="render_mode" value="mesh" checked /> Mesh 渲染（默认）</label>
            <label><input type="radio" name="render_mode" value="gs" /> 3D Gaussian Splatting (GS)</label>
          </div>
        </div>

        <fieldset id="gs_fieldset" class="gs-fieldset" disabled>
          <legend>GS 数字资产</legend>
          <div id="gs_scene_group" class="field inline"></div>
          <div id="gs_assets_group" class="checkbox-group"></div>
          <div class="field inline">
            <label for="gs_z">GS 高度偏移 gsZ</label>
            <input id="gs_z" type="number" step="0.01" value="0" />
          </div>
        </fieldset>

        <details class="advanced">
          <summary>高级选项</summary>
          <label class="checkbox-line"><input id="opt_randomize" type="checkbox" /> 启用场景随机化</label>
          <label class="checkbox-line"><input id="opt_sync" type="checkbox" /> 同步仿真墙钟</label>
        </details>

        <div class="actions">
          <button id="btn_start" type="button" class="primary">启动 Viewer</button>
          <button id="btn_stop_all" type="button" class="secondary">停止全部会话</button>
        </div>
        <p id="form_message" class="message" aria-live="polite"></p>
      </section>

      <section class="panel sessions-panel">
        <h2>活跃会话</h2>
        <div id="sessions_list" class="sessions-list">
          <p class="empty">暂无活跃会话</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>任务组合由 <code>make_env(robot, task)</code> 生成 MJCF</span>
      <span>文档：<code>web_viewer/launcher/docs/</code></span>
    </footer>
  </div>
  <script type="module" src="/static/launcher.js"></script>
</body>
</html>
