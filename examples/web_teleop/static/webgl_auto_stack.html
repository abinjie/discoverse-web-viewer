<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISCOVERSE WebGL 自动叠方块</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #111527; color: #d7defc; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #root { display: grid; grid-template-columns: 1fr 320px; height: 100%; min-height: 0; }
    #view { position: relative; overflow: hidden; min-height: 0; height: 100%; }
    #view > canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #panel { background: #1c233a; padding: 14px; border-left: 1px solid #2d3552; }
    .row { margin: 8px 0; font-size: 13px; color: #9db0ff; }
    .tip { color: #7f8cc2; font-size: 12px; line-height: 1.5; margin-top: 12px; }
    #status { color: #86e1b3; font-size: 12px; margin-top: 8px; }
    /* 与 Three.js HUD 中的小窗标签对齐（机械臂右下角画中画旁） */
    #arm_cam_label {
      position: absolute;
      right: max(14px, 2%);
      /* 与 HUD 小窗对齐：margin 2% + 高度 21% */
      bottom: calc(max(14px, 2%) + 21vh + 6px);
      font-size: 11px;
      color: rgba(215, 222, 252, 0.85);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 3;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(22, 32, 58, 0.72);
      border: 1px solid rgba(99, 120, 183, 0.45);
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="view">
      <div id="arm_cam_label">腕部相机 · eye_arm</div>
    </div>
    <div id="panel">
      <h3 style="margin: 0 0 8px 0;">WebGL 自动叠方块</h3>
      <div class="row">坐标系：armbase 本地坐标</div>
      <div class="row">仿真时间：<span id="time">-</span></div>
      <div id="status">连接中...</div>
      <div class="tip">
        操作说明：<br />
        - 鼠标左键拖动空白区域：360°旋转视角<br />
        - 滚轮：缩放<br />
        - 右下角小窗：机械臂腕部相机（MuJoCo eye_arm）第一视角。<br />
        - 后端正在自动执行 stack_block.py 的抓取逻辑，前端仅做渲染同步。<br />
        - <a href="/hybrid">混合视图：环境 3DGS（ply）+ mesh 机械臂/方块</a><br />
        - <a href="/gs">仅预览 3DGS PLY</a>（<code>/gs?ply=/models/3dgs/...</code>）
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js";
    import { OBJLoader } from "https://unpkg.com/three@0.164.1/examples/jsm/loaders/OBJLoader.js";

    const view = document.getElementById("view");
    const statusEl = document.getElementById("status");
    const timeEl = document.getElementById("time");

    THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16203a);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
    camera.up.set(0, 0, 1);
    camera.position.set(1.8, -1.8, 1.3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    view.appendChild(renderer.domElement);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.target.set(0, 0, 0.35);
    orbit.enableDamping = true;

    // 与 MuJoCo airbot_play.xml 中 eye_arm 一致：挂载在 link6 子 body 上
    const ARM_RT_W = 320;
    const ARM_RT_H = 240;
    const armRt = new THREE.WebGLRenderTarget(ARM_RT_W, ARM_RT_H, { depthBuffer: true });
    armRt.texture.colorSpace = THREE.SRGBColorSpace;

    const hudCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 40);
    hudCam.position.set(0, 0, 10);
    const hudScene = new THREE.Scene();
    const hudMat = new THREE.MeshBasicMaterial({
      map: armRt.texture,
      depthTest: false,
      depthWrite: false,
      toneMapped: false,
    });
    const hudW = 0.56;
    const hudH = 0.42;
    const margin = 0.04;
    const hudX = 1 - margin - hudW / 2;
    const hudY = -1 + margin + hudH / 2;

    const hudPlane = new THREE.Mesh(new THREE.PlaneGeometry(hudW, hudH), hudMat);
    hudPlane.position.set(hudX, hudY, 0);
    hudPlane.renderOrder = 99999;
    hudScene.add(hudPlane);

    const frameGeo = new THREE.PlaneGeometry(hudW + 0.012, hudH + 0.012);
    const frameMat = new THREE.MeshBasicMaterial({
      color: 0x6378b7,
      depthTest: false,
      depthWrite: false,
      toneMapped: false,
    });
    const hudFrame = new THREE.Mesh(frameGeo, frameMat);
    hudFrame.position.set(hudX, hudY, -0.001);
    hudFrame.renderOrder = 99998;
    hudScene.add(hudFrame);

    const hemi = new THREE.HemisphereLight(0xeaf1ff, 0x4a5f86, 0.8);
    scene.add(hemi);
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(2.5, -2, 3.2);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xdbe6ff, 0.55);
    fillLight.position.set(-2.2, 1.8, 2.4);
    scene.add(fillLight);
    scene.add(new THREE.AmbientLight(0xaec0e6, 0.35));

    const grid = new THREE.GridHelper(4, 40, 0x6378b7, 0x324267);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    // 桌子
    const tableGroup = new THREE.Group();
    scene.add(tableGroup);
    const tableTopSize = { x: 0.9, y: 0.6, z: 0.03 };
    const tableTop = new THREE.Mesh(
      new THREE.BoxGeometry(tableTopSize.x, tableTopSize.y, tableTopSize.z),
      new THREE.MeshStandardMaterial({ color: 0xf2f3f7, roughness: 0.78, metalness: 0.04 })
    );
    tableTop.position.set(0.35, 0.0, -0.03);
    tableGroup.add(tableTop);

    const legMat = new THREE.MeshStandardMaterial({ color: 0xd7d9de, roughness: 0.72, metalness: 0.1 });
    const legH = 0.72;
    const legW = 0.03;
    const legPos = [
      [tableTop.position.x - tableTopSize.x / 2 + 0.05, tableTop.position.y - tableTopSize.y / 2 + 0.05],
      [tableTop.position.x - tableTopSize.x / 2 + 0.05, tableTop.position.y + tableTopSize.y / 2 - 0.05],
      [tableTop.position.x + tableTopSize.x / 2 - 0.05, tableTop.position.y - tableTopSize.y / 2 + 0.05],
      [tableTop.position.x + tableTopSize.x / 2 - 0.05, tableTop.position.y + tableTopSize.y / 2 - 0.05],
    ];
    for (const [lx, ly] of legPos) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(legW, legW, legH), legMat);
      leg.position.set(lx, ly, tableTop.position.z - tableTopSize.z / 2 - legH / 2);
      tableGroup.add(leg);
    }

    // 三个方块
    const blockGeo = new THREE.BoxGeometry(0.04, 0.04, 0.04);
    const blocks = {
      block_red: new THREE.Mesh(blockGeo, new THREE.MeshStandardMaterial({ color: 0xff4444 })),
      block_green: new THREE.Mesh(blockGeo, new THREE.MeshStandardMaterial({ color: 0x44ff44 })),
      block_blue: new THREE.Mesh(blockGeo, new THREE.MeshStandardMaterial({ color: 0x4444ff }))
    };
    for (const b in blocks) {
      blocks[b].position.set(0, 0, -10); // 初始隐藏在地下
      scene.add(blocks[b]);
    }

    // 机械臂
    const meshRoot = new THREE.Group();
    scene.add(meshRoot);

    const objLoader = new OBJLoader();
    const meshMatDark = new THREE.MeshStandardMaterial({ color: 0x2a2e39, metalness: 0.25, roughness: 0.65 });
    const meshMatLight = new THREE.MeshStandardMaterial({ color: 0xdadce3, metalness: 0.15, roughness: 0.55 });

    function quatFromWxyz(q) { return new THREE.Quaternion(q[1], q[2], q[3], q[0]); }

    function cloneWithMaterial(obj, material) {
      const c = obj.clone(true);
      c.traverse((n) => {
        if (n.isMesh) {
          n.material = material;
          n.castShadow = true;
          n.receiveShadow = true;
        }
      });
      return c;
    }

    async function loadObj(url) {
      return await new Promise((resolve, reject) => {
        objLoader.load(url, resolve, undefined, reject);
      });
    }

    async function buildAirbotMesh() {
      statusEl.textContent = "加载机械臂 mesh...";
      const files = {
        arm_base_0: "/models/meshes/airbot_play/arm_base_0.obj",
        arm_base_1: "/models/meshes/airbot_play/arm_base_1.obj",
        link1: "/models/meshes/airbot_play/link1.obj",
        link2_0: "/models/meshes/airbot_play/link2_0.obj",
        link2_1: "/models/meshes/airbot_play/link2_1.obj",
        link3_0: "/models/meshes/airbot_play/link3_0.obj",
        link3_1: "/models/meshes/airbot_play/link3_1.obj",
        link4: "/models/meshes/airbot_play/link4.obj",
        link5_0: "/models/meshes/airbot_play/link5_0.obj",
        link5_1: "/models/meshes/airbot_play/link5_1.obj",
        link6: "/models/meshes/airbot_play/link6.obj",
        camera_stand: "/models/meshes/airbot_play/camera_stand.obj",
        left: "/models/meshes/airbot_play/left.obj",
        right: "/models/meshes/airbot_play/right.obj",
      };
      const entries = await Promise.all(Object.entries(files).map(async ([k, url]) => [k, await loadObj(url)]));
      const libs = Object.fromEntries(entries);

      const linkBase = new THREE.Group();
      meshRoot.add(linkBase);
      const armBase0 = cloneWithMaterial(libs.arm_base_0, meshMatDark);
      armBase0.position.set(0, 0, -0.0015);
      linkBase.add(armBase0);
      linkBase.add(cloneWithMaterial(libs.arm_base_1, meshMatLight));

      const j1Frame = new THREE.Group();
      j1Frame.position.set(0, 0, 0.1172);
      linkBase.add(j1Frame);
      const j1Rot = new THREE.Group();
      j1Frame.add(j1Rot);
      const link1 = new THREE.Group(); j1Rot.add(link1);
      link1.add(cloneWithMaterial(libs.link1, meshMatLight));

      const j2Frame = new THREE.Group();
      j2Frame.quaternion.copy(quatFromWxyz([0.135866, 0.135867, -0.69393, 0.693932]));
      link1.add(j2Frame);
      const j2Rot = new THREE.Group();
      j2Frame.add(j2Rot);
      const link2 = new THREE.Group(); j2Rot.add(link2);
      link2.add(cloneWithMaterial(libs.link2_0, meshMatDark));
      link2.add(cloneWithMaterial(libs.link2_1, meshMatLight));

      const j3Frame = new THREE.Group();
      j3Frame.position.set(0.27009, 0, 0);
      j3Frame.quaternion.copy(quatFromWxyz([0.192144, 0, 0, -0.981367]));
      link2.add(j3Frame);
      const j3Rot = new THREE.Group();
      j3Frame.add(j3Rot);
      const link3 = new THREE.Group(); j3Rot.add(link3);
      link3.add(cloneWithMaterial(libs.link3_0, meshMatDark));
      link3.add(cloneWithMaterial(libs.link3_1, meshMatLight));

      const j4Frame = new THREE.Group();
      j4Frame.position.set(0.29015, 0, 0);
      j4Frame.quaternion.copy(quatFromWxyz([-2.59734e-06, 0.707105, 2.59735e-06, 0.707108]));
      link3.add(j4Frame);
      const j4Rot = new THREE.Group();
      j4Frame.add(j4Rot);
      const link4 = new THREE.Group(); j4Rot.add(link4);
      link4.add(cloneWithMaterial(libs.link4, meshMatLight));

      const j5Frame = new THREE.Group();
      j5Frame.quaternion.copy(quatFromWxyz([0.707105, 0.707108, 0, 0]));
      link4.add(j5Frame);
      const j5Rot = new THREE.Group();
      j5Frame.add(j5Rot);
      const link5 = new THREE.Group(); j5Rot.add(link5);
      link5.add(cloneWithMaterial(libs.link5_0, meshMatDark));
      link5.add(cloneWithMaterial(libs.link5_1, meshMatLight));

      const j6Frame = new THREE.Group();
      j6Frame.position.set(0, 0.23645, 0);
      j6Frame.quaternion.copy(quatFromWxyz([0.499998, -0.5, 0.5, 0.500002]));
      link5.add(j6Frame);
      const j6Rot = new THREE.Group();
      j6Frame.add(j6Rot);
      const link6 = new THREE.Group(); j6Rot.add(link6);
      link6.add(cloneWithMaterial(libs.link6, meshMatDark));
      link6.add(cloneWithMaterial(libs.camera_stand, meshMatDark));

      const leftSlide = new THREE.Group();
      link6.add(leftSlide);
      leftSlide.add(cloneWithMaterial(libs.right, meshMatLight));
      const rightSlide = new THREE.Group();
      link6.add(rightSlide);
      rightSlide.add(cloneWithMaterial(libs.left, meshMatLight));

      // eye_arm：models/mjcf/manipulator/airbot_play/airbot_play.xml
      const armCamBody = new THREE.Group();
      link6.add(armCamBody);
      armCamBody.position.set(-0.105, 0, -0.12);
      armCamBody.rotation.order = "XYZ";
      armCamBody.rotation.set(Math.PI, 0, Math.PI / 2);
      const armCamera = new THREE.PerspectiveCamera(
        72.5376526571421,
        ARM_RT_W / ARM_RT_H,
        0.02,
        20
      );
      armCamera.up.set(0, 0, 1);
      armCamera.rotation.order = "XYZ";
      armCamera.rotation.x = -0.5236;
      armCamBody.add(armCamera);

      return {
        armJoints: [j1Rot, j2Rot, j3Rot, j4Rot, j5Rot, j6Rot],
        leftSlide,
        rightSlide,
        armCamera,
      };
    }

    let armJointRotators = [];
    let leftSlideJoint = null;
    let rightSlideJoint = null;
    let armCamera = null;
    buildAirbotMesh()
      .then((robot) => {
        armJointRotators = robot.armJoints;
        leftSlideJoint = robot.leftSlide;
        rightSlideJoint = robot.rightSlide;
        armCamera = robot.armCamera;
        statusEl.textContent = "场景加载完成，等待同步...";
      })
      .catch((err) => {
        console.error("load mesh failed", err);
        statusEl.textContent = "机械臂 mesh 加载失败（请看控制台）";
      });

    async function syncState() {
      try {
        const r = await fetch("/state", { cache: "no-store" });
        const j = await r.json();
        if (!j.ok) return;

        timeEl.textContent = j.time.toFixed(2) + " s";

        // 更新机械臂关节
        const jq = j.jq || [];
        for (let i = 0; i < armJointRotators.length && i < jq.length; i++) {
          armJointRotators[i].rotation.z = jq[i];
        }
        const gripper = (jq.length > 6) ? jq[6] : 0.0;
        if (leftSlideJoint) leftSlideJoint.position.y = Math.max(0.0, Math.min(0.04, gripper));
        if (rightSlideJoint) rightSlideJoint.position.y = Math.max(-0.04, Math.min(0.0, -gripper));

        // 更新方块
        if (j.blocks) {
          for (const b in j.blocks) {
            if (blocks[b]) {
              const p = j.blocks[b].pos;
              const q = j.blocks[b].quat_wxyz;
              blocks[b].position.set(p[0], p[1], p[2]);
              blocks[b].quaternion.copy(fromWxyz(q));
            }
          }
        }
      } catch (_) {}
    }

    const fromWxyz = (wxyz) => new THREE.Quaternion(wxyz[1], wxyz[2], wxyz[3], wxyz[0]);

    setInterval(syncState, 33); // ~30fps
    syncState();

    function resize() {
      const w = view.clientWidth;
      const h = view.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", resize);
    resize();

    function render() {
      orbit.update();

      if (armCamera) {
        renderer.setRenderTarget(armRt);
        renderer.render(scene, armCamera);
      }

      renderer.setRenderTarget(null);
      renderer.autoClear = true;
      renderer.render(scene, camera);

      if (armCamera) {
        renderer.autoClear = false;
        renderer.render(hudScene, hudCam);
        renderer.autoClear = true;
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
