<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISCOVERSE 网页遥操作</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #1a1b26; color: #c0caf5; }
    body { margin: 0; padding: 16px; max-width: 1200px; margin-inline: auto; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .cam-wrap { position: relative; flex: 1 1 720px; min-width: 400px; user-select: none; }
    #cam { width: 100%; border-radius: 8px; background: #000; display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      pointer-events: none;
      border: 1px dashed rgba(122, 162, 247, 0.35);
    }
    .panel { flex: 1 1 320px; background: #24283b; padding: 12px 16px; border-radius: 8px; }
    label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; font-size: 0.85rem; }
    input[type="range"] { width: 160px; }
    button { margin: 6px 6px 0 0; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .primary { background: #7aa2f7; color: #1a1b26; }
    .ghost { background: #414868; color: #c0caf5; }
    #status { font-size: 0.8rem; color: #9aa5ce; margin-top: 12px; }
    .hint { font-size: 0.75rem; color: #565f89; margin-top: 8px; line-height: 1.4; }
    .kbd { color: #f7768e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>DISCOVERSE 机械臂 · 第三人称拖拽</h1>
  <p class="hint">
    末端目标在 <strong>armbase 坐标系</strong>：位置 xyz（米）+ 姿态四元数 wxyz。<br />
    拖拽操作：<span class="kbd">左键拖动</span>平移 XY，<span class="kbd">滚轮</span>调 Z，<span class="kbd">右键拖动</span>调姿态（Yaw/Pitch），<span class="kbd">Alt+右键</span>调 Roll。
  </p>
  <div class="row">
    <div class="cam-wrap" id="camWrap">
      <img id="cam" src="/video.mjpeg" alt="仿真画面" />
      <div id="overlay"></div>
    </div>
    <div class="panel">
      <div><strong>位置 (m)</strong></div>
      <label>x <input type="range" id="px" min="-0.5" max="0.8" step="0.005" value="0.35" /><span id="pxv"></span></label>
      <label>y <input type="range" id="py" min="-0.6" max="0.6" step="0.005" value="0" /><span id="pyv"></span></label>
      <label>z <input type="range" id="pz" min="-0.2" max="0.9" step="0.005" value="0.35" /><span id="pzv"></span></label>
      <div style="margin-top:12px"><strong>姿态 wxyz</strong></div>
      <label>w <input type="range" id="qw" min="-1" max="1" step="0.01" value="1" /><span id="qwv"></span></label>
      <label>x <input type="range" id="qx" min="-1" max="1" step="0.01" value="0" /><span id="qxv"></span></label>
      <label>y <input type="range" id="qy" min="-1" max="1" step="0.01" value="0" /><span id="qyv"></span></label>
      <label>z <input type="range" id="qz" min="-1" max="1" step="0.01" value="0" /><span id="qzv"></span></label>
      <div style="margin-top:12px">
        <button type="button" class="primary" id="send">发送目标</button>
        <button type="button" class="ghost" id="reset">重置仿真</button>
      </div>
      <div id="status">WebSocket 未连接</div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const sliders = ["px","py","pz","qw","qx","qy","qz"];
    function syncLabels() {
      sliders.forEach((id) => { const el = $(id); $(id + "v").textContent = (+el.value).toFixed(3); });
    }
    sliders.forEach((id) => $(id).addEventListener("input", syncLabels));
    syncLabels();

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = proto + "://" + location.host + "/ws";
    let sock = null;

    function connect() {
      sock = new WebSocket(wsUrl);
      sock.onopen = () => { $("status").textContent = "WebSocket 已连接"; };
      sock.onclose = () => {
        $("status").textContent = "连接断开，3 秒后重试…";
        setTimeout(connect, 3000);
      };
      sock.onerror = () => { $("status").textContent = "WebSocket 错误"; };
      sock.onmessage = (ev) => {
        try { const j = JSON.parse(ev.data); if (!j.ok) $("status").textContent = "服务端: " + (j.error || JSON.stringify(j)); }
        catch (_) {}
      };
    }
    connect();

    function normQuat(w, x, y, z) {
      const n = Math.hypot(w, x, y, z) || 1;
      return [w/n, x/n, y/n, z/n];
    }

    function quatMul(a, b) {
      const [aw, ax, ay, az] = a;
      const [bw, bx, by, bz] = b;
      return [
        aw * bw - ax * bx - ay * by - az * bz,
        aw * bx + ax * bw + ay * bz - az * by,
        aw * by - ax * bz + ay * bw + az * bx,
        aw * bz + ax * by - ay * bx + az * bw,
      ];
    }

    function axisAngle(axis, rad) {
      const s = Math.sin(rad / 2);
      return normQuat(Math.cos(rad / 2), axis[0] * s, axis[1] * s, axis[2] * s);
    }

    function getPoseFromUI() {
      const pos = [+ $("px").value, + $("py").value, + $("pz").value];
      const quat = normQuat(+ $("qw").value, + $("qx").value, + $("qy").value, + $("qz").value);
      return { pos, quat };
    }

    function setPoseToUI(pos, quat) {
      $("px").value = pos[0];
      $("py").value = pos[1];
      $("pz").value = pos[2];
      $("qw").value = quat[0];
      $("qx").value = quat[1];
      $("qy").value = quat[2];
      $("qz").value = quat[3];
      syncLabels();
    }

    function sendTarget() {
      if (!sock || sock.readyState !== WebSocket.OPEN) return;
      const { pos, quat } = getPoseFromUI();
      sock.send(JSON.stringify({ cmd: "set_target", pos, quat_wxyz: quat }));
    }

    $("send").onclick = sendTarget;
    $("reset").onclick = () => {
      if (sock && sock.readyState === WebSocket.OPEN)
        sock.send(JSON.stringify({ cmd: "reset" }));
    };

    let t = null;
    sliders.forEach((id) => {
      $(id).addEventListener("change", () => {
        clearTimeout(t);
        t = setTimeout(sendTarget, 80);
      });
    });

    // --- 第三人称拖拽 ---
    const camWrap = $("camWrap");
    const XY_GAIN = 0.0014;   // m / px
    const Z_GAIN = 0.0020;    // m / wheel-unit
    const ROT_GAIN = 0.0060;  // rad / px

    let drag = {
      active: false,
      button: 0,
      lastX: 0,
      lastY: 0,
      alt: false,
    };

    function clampPos(pos) {
      return [
        Math.max(-0.5, Math.min(0.8, pos[0])),
        Math.max(-0.6, Math.min(0.6, pos[1])),
        Math.max(-0.2, Math.min(0.9, pos[2])),
      ];
    }

    function applyDrag(dx, dy, button, alt) {
      const { pos, quat } = getPoseFromUI();
      if (button === 0) {
        // 左键：平移
        const np = clampPos([
          pos[0] + dx * XY_GAIN,
          pos[1] - dy * XY_GAIN,
          pos[2],
        ]);
        setPoseToUI(np, quat);
      } else if (button === 2) {
        // 右键：旋转（默认 yaw/pitch；Alt+右键为 roll）
        let q = quat;
        if (alt) {
          const q_roll = axisAngle([1, 0, 0], dx * ROT_GAIN);
          q = normQuat(...quatMul(q_roll, q));
        } else {
          const q_yaw = axisAngle([0, 0, 1], dx * ROT_GAIN);
          const q_pitch = axisAngle([0, 1, 0], -dy * ROT_GAIN);
          q = normQuat(...quatMul(q_pitch, quatMul(q_yaw, q)));
        }
        setPoseToUI(pos, q);
      }
    }

    camWrap.addEventListener("contextmenu", (ev) => ev.preventDefault());
    camWrap.addEventListener("mousedown", (ev) => {
      drag.active = true;
      drag.button = ev.button;
      drag.lastX = ev.clientX;
      drag.lastY = ev.clientY;
      drag.alt = ev.altKey;
      camWrap.style.cursor = ev.button === 2 ? "grabbing" : "move";
      ev.preventDefault();
    });
    window.addEventListener("mouseup", () => {
      drag.active = false;
      camWrap.style.cursor = "default";
    });
    window.addEventListener("mousemove", (ev) => {
      if (!drag.active) return;
      const dx = ev.clientX - drag.lastX;
      const dy = ev.clientY - drag.lastY;
      drag.lastX = ev.clientX;
      drag.lastY = ev.clientY;
      applyDrag(dx, dy, drag.button, drag.alt);
      clearTimeout(t);
      t = setTimeout(sendTarget, 25);
    });
    camWrap.addEventListener("wheel", (ev) => {
      const { pos, quat } = getPoseFromUI();
      const np = clampPos([pos[0], pos[1], pos[2] - ev.deltaY * Z_GAIN * 0.01]);
      setPoseToUI(np, quat);
      clearTimeout(t);
      t = setTimeout(sendTarget, 25);
      ev.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
